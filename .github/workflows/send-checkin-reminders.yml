name: Enviar lembretes de check-in (push)

on:
  schedule:
    # Toda segunda-feira às 9h, horário de Brasília (UTC-3) = 12h UTC
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  send-checkin-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/push/send-checkin-reminders
        run: |
          curl -sf -X POST "${{ secrets.IRONMIND_AI_URL }}/api/push/send-checkin-reminders" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"minDaysInactive": 7}'
