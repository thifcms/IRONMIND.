name: Enviar lembretes de treino (push)

# Roda todo dia às 18h no horário de Brasília (21:00 UTC) -- horário
# "fim de tarde" tende a pegar gente decidindo se ainda vai treinar
# hoje, sem ser cedo demais nem tarde da noite incomodando.
#
# Chama o backend do IronMind AI, que checa quem está com streak
# parado há 3+ dias e manda a notificação push -- toda a lógica de
# quem recebe o quê vive no backend (ver /api/push/send-reminders em
# Ironmind-ai-funcionando/apiApp.ts); este workflow só aperta o botão
# no horário certo.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: # permite disparar manualmente pra testar

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de lembretes
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.IRONMIND_AI_URL }}/api/push/send-reminders" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"minDaysInactive": 3}')
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "Resposta ($http_code): $body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Falha ao enviar lembretes (HTTP $http_code)"
            exit 1
          fi
