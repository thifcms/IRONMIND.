<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1830"/>
      <stop offset="60%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#060e1e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3377ff"/>
      <stop offset="100%" style="stop-color:#0044cc"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8eaf4"/>
      <stop offset="50%" style="stop-color:#c0c8e0"/>
      <stop offset="100%" style="stop-color:#a0a8c0"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2e50"/>
      <stop offset="100%" style="stop-color:#0d1a38"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>

  <!-- Subtle gradient overlay -->
  <rect width="512" height="512" rx="100" ry="100" fill="rgba(30,50,120,0.08)"/>

  <!-- Top blue line accent -->
  <rect x="100" y="0" width="312" height="4" rx="2" fill="url(#blue)" opacity="0.7"/>

  <!-- Icon box (like in the logo) -->
  <rect x="52" y="160" width="160" height="160" rx="20" fill="url(#boxGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Box shine -->
  <rect x="52" y="160" width="160" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>

  <!-- DUMBBELL inside box -->
  <!-- Left plate -->
  <rect x="68" y="210" width="16" height="60" rx="5" fill="url(#silver)"/>
  <!-- Left collar -->
  <rect x="84" y="220" width="12" height="40" rx="4" fill="url(#blue)"/>
  <!-- Bar -->
  <rect x="96" y="228" width="80" height="24" rx="5" fill="url(#silver)"/>
  <!-- Bar shine -->
  <rect x="96" y="230" width="80" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>
  <!-- Right collar -->
  <rect x="176" y="220" width="12" height="40" rx="4" fill="url(#blue)"/>
  <!-- Right plate -->
  <rect x="188" y="210" width="16" height="60" rx="5" fill="url(#silver)"/>

  <!-- Glow under dumbbell -->
  <ellipse cx="132" cy="278" rx="55" ry="6" fill="#2266ff" opacity="0.2" filter="url(#glow)"/>

  <!-- IRONMIND text - right side of box, bold italic like logo -->
  <!-- IRON - white -->
  <text x="235" y="220"
    font-family="Arial Black, Impact, sans-serif"
    font-weight="900"
    font-size="78"
    font-style="italic"
    letter-spacing="-2"
    fill="white"
    opacity="0.95">IRON</text>

  <!-- MIND - blue -->
  <text x="235" y="302"
    font-family="Arial Black, Impact, sans-serif"
    font-weight="900"
    font-size="78"
    font-style="italic"
    letter-spacing="-2"
    fill="url(#blue)"
    filter="url(#textGlow)">MIND</text>

  <!-- STRENGTH · RESILIENCE subtitle -->
  <text x="256" y="370"
    font-family="Arial, sans-serif"
    font-weight="400"
    font-size="22"
    letter-spacing="5"
    text-anchor="middle"
    fill="rgba(180,190,220,0.55)">STRENGTH · RESILIENCE</text>

  <!-- Bottom blue accent line -->
  <rect x="130" y="386" width="252" height="1.5" rx="1" fill="url(#blue)" opacity="0.4"/>

  <!-- Inner border -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="99" ry="99" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="3"/>
</svg>
