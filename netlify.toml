[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Rotas /api/* vao pra funcao serverless (mesmo Express app do Render,
# via apiApp.ts + netlify/functions/api.ts)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback: qualquer outra rota cai no index.html (React Router / navegacao direta)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
