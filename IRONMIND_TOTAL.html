    <!-- Fonts -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap');
        
        :root {
          --tab-bar-height: 70px;
          --header-height: 60px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .notranslate { translate: no; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        input:focus, textarea:focus {
            font-size: 16px !important; /* Prevents auto-zoom on iOS */
        }
        
        .tab-content {
          height: calc(100vh - var(--header-height) - var(--tab-bar-height) - 20px);
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }

        /* 3D Neumorphism / Claymorphism Button Style */
        .btn-3d {
          box-shadow: 4px 4px 0px #cbd5e1;
          transition: all 0.1s active:translate-x-[2px] active:translate-y-[2px] active:shadow-none;
        }

        .btn-3d-blue {
          box-shadow: 4px 4px 0px #1e40af;
          transition: all 0.1s active:translate-x-[2px] active:translate-y-[2px] active:shadow-none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-hidden">
    <div id="root"></div>

    <!-- React, Lucide, Recharts via ESM -->
    <script type="module">
        import React, { useState, useEffect, useMemo, useRef, useCallback } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import * as LucideImport from 'https://esm.sh/lucide-react@0.344.0';
        import { motion, AnimatePresence } from 'https://esm.sh/framer-motion@11.0.8';

        } from 'https://esm.sh/recharts@2.12.2';

        const Lucide = LucideImport;
        const {

          Flame, Utensils, Music, Heart, ExternalLink, Send,
          Check, Loader2, Clock, Scale, Ruler, Award, Zap,
          Wind, RotateCcw, Pause, StickyNote, Filter, Camera,
          AlertTriangle
        } = Lucide;

        // --- BIBLIOTECA DE EXERCÍCIOS COMPLETA ---
        const EXERCISE_LIBRARY = [
            { name: 'Supino Reto (Barra)', muscle: 'Peito', videoUrl: 'https://www.youtube.com/watch?v=scfJ-XN9-nU' },
            { name: 'Supino Inclinado (Barra)', muscle: 'Peito', videoUrl: 'https://www.youtube.com/watch?v=SrqOu55lr6A' },
            { name: 'Supino Reto (Haltere)', muscle: 'Peito', videoUrl: 'https://www.youtube.com/watch?v=VmBQ6scIbe4' },
            { name: 'Supino Inclinado (Haltere)', muscle: 'Peito', videoUrl: 'https://www.youtube.com/watch?v=5ceR_Kdfid0' },
            { name: 'Crucifixo Reto', muscle: 'Peito' },
            { name: 'Crossover (Polia Alta)', muscle: 'Peito' },
            { name: 'Fly (Máquina)', muscle: 'Peito' },
            { name: 'Flexão de Braços', muscle: 'Peito' },
            { name: 'Puxada Aberta (Pulley)', muscle: 'Costas' },
            { name: 'Remada Curvada (Barra)', muscle: 'Costas' },
            { name: 'Remada Unilateral (Serrote)', muscle: 'Costas' },
            { name: 'Puxada com Triângulo', muscle: 'Costas' },
            { name: 'Remada Baixa (Triângulo)', muscle: 'Costas' },
            { name: 'Levantamento Terra', muscle: 'Costas' },
            { name: 'Pull Down (Corda)', muscle: 'Costas' },
            { name: 'Barra Fixa', muscle: 'Costas' },
            { name: 'Agachamento Livre', muscle: 'Pernas' },
            { name: 'Leg Press 45', muscle: 'Pernas' },
            { name: 'Extensora', muscle: 'Pernas' },
            { name: 'Flexora Deitada', muscle: 'Pernas' },
            { name: 'Flexora Sentada', muscle: 'Pernas' },
            { name: 'Afundo (Haltere)', muscle: 'Pernas' },
            { name: 'Stiff (Barra)', muscle: 'Pernas' },
            { name: 'Cadeira Abdutora', muscle: 'Pernas' },
            { name: 'Cadeira Adutora', muscle: 'Pernas' },
            { name: 'Gêmeos em Pé', muscle: 'Pernas' },
            { name: 'Gêmeos Sentado', muscle: 'Pernas' },
            { name: 'Desenvolvimento (Barra)', muscle: 'Ombros' },
            { name: 'Elevação Lateral', muscle: 'Ombros' },
            { name: 'Elevação Frontal', muscle: 'Ombros' },
            { name: 'Posterior de Ombro (Corda)', muscle: 'Ombros' },
            { name: 'Encolhimento (Haltere)', muscle: 'Ombros' },
            { name: 'Rosca Direta (Barra E-Z)', muscle: 'Bíceps' },
            { name: 'Rosca Alternada', muscle: 'Bíceps' },
            { name: 'Rosca Martelo', muscle: 'Bíceps' },
            { name: 'Rosca Scott', muscle: 'Bíceps' },
            { name: 'Tríceps Pulley (Barra)', muscle: 'Tríceps' },
            { name: 'Tríceps Corda', muscle: 'Tríceps' },
            { name: 'Tríceps Testa', muscle: 'Tríceps' },
            { name: 'Mergulho (Paralelas)', muscle: 'Tríceps' },
            { name: 'Abdominal Supra', muscle: 'Abdômen' },
            { name: 'Abdominal Infra', muscle: 'Abdômen' },
            { name: 'Plancha Isométrica', muscle: 'Abdômen' }
        ];

        const MUSCLE_GROUPS = Array.from(new Set(EXERCISE_LIBRARY.map(ex => ex.muscle)));

        // --- ENUMS SIMULADOS ---
        const Tab = {
          TREINADOR: 'treinador',
          AQUECIMENTO: 'aquecimento',
          TREINO: 'treino',
          VIDEOS: 'videos',
          CARDIO: 'cardio',
          DIETA: 'dieta',
          SOM: 'som',
          HISTORICO: 'historico'
        };

        const exportApp = () => {
          const html = document.documentElement.outerHTML;
          const blob = new Blob([html], { type: 'text/html' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'IronMind_TOTAL.html';
          a.click();
        };

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('GEMINI_API_KEY') || '');
            const [showKeyModal, setShowKeyModal] = useState(!apiKey);
            const [activeTab, setActiveTab] = useState(Tab.TREINADOR);
            const [isOpening, setIsOpening] = useState(true);
            const [sessionTime, setSessionTime] = useState(0);

            // Estados de Dados
            const [trainingPlan, setTrainingPlan] = useState(() => {
                const saved = localStorage.getItem('trainingPlan');
                return saved ? JSON.parse(saved) : null;
            });
            const [dietPlan, setDietPlan] = useState(() => {
                const saved = localStorage.getItem('dietPlan');
                return saved ? JSON.parse(saved) : null;
            });
            const [chatHistory, setChatHistory] = useState(() => {
                const saved = localStorage.getItem('chatHistory');
                return saved ? JSON.parse(saved) : [
                    { role: 'model', text: 'Olá! Sou o <span translate="no" class="notranslate">IronMind</span>, seu treinador pessoal. Vamos começar? Posso montar um treino, uma dieta ou analisar seu progresso.' }
                ];
            });
            const [weightHistory, setWeightHistory] = useState(() => {
                const saved = localStorage.getItem('weightHistory');
                return saved ? JSON.parse(saved) : [{ date: Date.now(), weight: 80 }];
            });
            const [measurementHistory, setMeasurementHistory] = useState(() => {
                const saved = localStorage.getItem('measurementHistory');
                return saved ? JSON.parse(saved) : [];
            });
            const [loadHistory, setLoadHistory] = useState(() => {
                const saved = localStorage.getItem('loadHistory');
                return saved ? JSON.parse(saved) : [];
            });
            const [userProfile, setUserProfile] = useState(() => {
                const saved = localStorage.getItem('userProfile');
                return saved ? JSON.parse(saved) : { height: 180 };
            });

            // Persistência
            useEffect(() => { localStorage.setItem('chatHistory', JSON.stringify(chatHistory)); }, [chatHistory]);
            useEffect(() => { localStorage.setItem('trainingPlan', JSON.stringify(trainingPlan)); }, [trainingPlan]);
            useEffect(() => { localStorage.setItem('dietPlan', JSON.stringify(dietPlan)); }, [dietPlan]);
            useEffect(() => { localStorage.setItem('weightHistory', JSON.stringify(weightHistory)); }, [weightHistory]);
            useEffect(() => { localStorage.setItem('measurementHistory', JSON.stringify(measurementHistory)); }, [measurementHistory]);
            useEffect(() => { localStorage.setItem('loadHistory', JSON.stringify(loadHistory)); }, [loadHistory]);
            useEffect(() => { localStorage.setItem('userProfile', JSON.stringify(userProfile)); }, [userProfile]);

            // Timer de Sessão
            useEffect(() => {
                const interval = setInterval(() => setSessionTime(p => p + 1), 1000);
                return () => clearInterval(interval);
            }, []);

            const formatSessionTime = (s) => {
                const mins = Math.floor(s / 60);
                const secs = s % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const buildManualTraining = () => {
                const plan = {
                    id: Date.now().toString(),
                    name: 'Treino Manual',
                    createdAt: Date.now(),
                    days: [
                        { label: 'Treino A', exercises: [] },
                        { label: 'Treino B', exercises: [] }
                    ]
                };
                setTrainingPlan(plan);
                setActiveTab(Tab.TREINO);
            };

            const handleAcceptTraining = (plan) => {
                setTrainingPlan(plan);
                setActiveTab(Tab.TREINO);
            };

            const handleAcceptDiet = (plan) => {
                setDietPlan(plan);
                setActiveTab(Tab.DIETA);
            };

            return React.createElement(React.Fragment, null,
                React.createElement(AnimatePresence, null,
                    isOpening && React.createElement(SplashScreen, { onComplete: () => setIsOpening(false) })
                ),

                React.createElement('div', { className: 'flex flex-col h-screen max-w-md mx-auto bg-white shadow-2xl relative overflow-hidden' },
                    // Header
                    React.createElement('header', { className: 'px-4 py-3 flex justify-between items-center bg-slate-100 border-b border-slate-200 z-30' },
                        React.createElement('div', { className: 'flex items-center gap-3 bg-gradient-to-br from-slate-200 to-slate-300 p-2 px-5 rounded-sm shadow-[4px_4px_0px_#475569] border border-slate-300' },
                            React.createElement('div', { className: 'w-6 h-6 bg-slate-900 rounded-px flex items-center justify-center' },
                                React.createElement(Dumbbell, { className: 'w-4 h-4 text-white transform -rotate-12' })
                            ),
                            React.createElement('h1', { className: 'font-black text-xl uppercase italic tracking-tighter notranslate', translate: 'no' }, 
                                React.createElement('span', { className: 'text-slate-900' }, 'IRON'),
                                React.createElement('span', { className: 'text-blue-600' }, 'MIND')
                            )
                        ),
                        React.createElement('div', { className: 'flex items-center gap-2' },
                            React.createElement('div', { className: 'bg-white px-2 py-1 rounded-lg border-2 border-slate-200 flex items-center gap-1.5 shadow-[2px_2px_0px_#cbd5e1]' },
                                React.createElement(Timer, { className: 'w-3 h-3 text-blue-500 animate-pulse' }),
                                React.createElement('span', { className: 'text-[9px] font-black font-mono' }, formatSessionTime(sessionTime))
                            ),
                            React.createElement('button', {
                                onClick: () => setShowKeyModal(true),
                                className: 'p-2 bg-white rounded-lg border-2 border-slate-200 text-slate-400'
                            }, React.createElement(Key, { className: 'w-4 h-4' }))
                        )
                    ),

                    // Main
                    React.createElement('main', { className: 'flex-1 overflow-hidden relative pb-16' },
                        React.createElement(AnimatePresence, { mode: 'wait' },
                          React.createElement(motion.div, { 
                            key: activeTab,
                            initial: { opacity: 0, x: 10 },
                            animate: { opacity: 1, x: 0 },
                            exit: { opacity: 0, x: -10 },
                            className: 'h-full tab-content'
                          },
                            activeTab === Tab.TREINADOR && React.createElement(CoachTab, { 
                                history: chatHistory, 
                                setHistory: setChatHistory, 
                                apiKey, 
                                onAcceptTraining: handleAcceptTraining,
                                onAcceptDiet: handleAcceptDiet,
                                onClearChat: () => { setChatHistory([{ role: 'model', text: 'Conversa resetada. Como posso ajudar?' }]); localStorage.removeItem('chatHistory'); }
                            }),
                            activeTab === Tab.AQUECIMENTO && React.createElement(WarmupTab, null),
                            activeTab === Tab.TREINO && React.createElement(TrainingTab, { 
                                plan: trainingPlan, 
                                onUpdatePlan: setTrainingPlan,
                                onRequestNew: () => setActiveTab(Tab.TREINADOR),
                                onClearPlan: () => { setTrainingPlan(null); localStorage.removeItem('trainingPlan'); },
                                buildManualTraining
                            }),
                            activeTab === Tab.VIDEOS && (trainingPlan ? React.createElement(VideosTab, { plan: trainingPlan }) : React.createElement(EmptyState, { type: 'vídeos', onClick: () => setActiveTab(Tab.TREINADOR) })),
                            activeTab === Tab.DIETA && React.createElement(DietTab, { 
                                plan: dietPlan, 
                                apiKey,
                                onClearPlan: () => { setDietPlan(null); localStorage.removeItem('dietPlan'); },
                                onRequestNew: () => setActiveTab(Tab.TREINADOR)
                            }),
                            activeTab === Tab.CARDIO && React.createElement(CardioTab, null),
                            activeTab === Tab.SOM && React.createElement(MusicTab, null),
                            activeTab === Tab.HISTORICO && React.createElement(HistoryTab, {
                                weightHistory, setWeightHistory,
                                measurementHistory, setMeasurementHistory,
                                loadHistory, setLoadHistory,
                                userProfile, setUserProfile
                            })
                          )
                        )
                    ),

                    // Tabs
                    React.createElement('nav', { className: 'fixed bottom-0 left-0 right-0 max-w-md mx-auto glass border-t border-slate-100 flex justify-around p-2 z-40' },
                        [
                        { id: Tab.TREINADOR, icon: MessageSquare, label: 'Treinadora' },
                            { id: Tab.TREINO, icon: Dumbbell, label: 'Treino' },
                            { id: Tab.VIDEOS, icon: Play, label: 'Vídeos' },
                            { id: Tab.DIETA, icon: Utensils, label: 'Dieta' },
                            { id: Tab.SOM, icon: Music, label: 'Som' },
                            { id: Tab.HISTORICO, icon: TrendingUp, label: 'Evol.' }
                        ].map(tab => React.createElement('button', {
                            key: tab.id,
                            onClick: () => setActiveTab(tab.id),
                            className: `flex flex-col items-center gap-1 transition-all ${activeTab === tab.id ? 'text-blue-600 scale-110' : 'text-slate-400'}`
                        }, 
                            React.createElement(tab.icon, { className: 'w-5 h-5' }),
                            React.createElement('span', { className: 'text-[9px] font-black uppercase tracking-tighter' }, tab.label)
                        ))
                    ),

                    // Modals
                    showKeyModal && React.createElement(APIKeyModal, { 
                        onSave: (k) => { setApiKey(k); localStorage.setItem('GEMINI_API_KEY', k); setShowKeyModal(false); },
                        onClose: () => setShowKeyModal(false)
                    })
                )
            );
        }

        // --- SUB-COMPONENTES ---

        function CoachTab({ history, setHistory, apiKey, onAcceptTraining, onAcceptDiet, onClearChat }) {
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => { scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' }); }, [history]);

            const handleSend = async () => {
                if (!input.trim() || !apiKey || isLoading) return;
                const newMsg = { role: 'user', text: input };
                setHistory(p => [...p, newMsg]);
                setInput('');
                setIsLoading(true);

                try {
                    const genAI = new GoogleGenerativeAI(apiKey);
                    const model = genAI.getGenerativeModel({ 
                        model: "gemini-2.0-flash",
                        systemInstruction: "Você é a Treinadora IronMind, especialista em biomecânica e nutrição. Seja motivadora e técnica. Use sempre o feminino. Formate sua resposta como texto rico. Se detectar que o usuário quer um novo treino completo, forneça o JSON de um objeto TrainingPlan (id, name, createdAt, days:[{label, exercises:[{id, name, sets, reps, weight}]}]) cercado por triple-backticks json no final. O mesmo para DietPlan."
                    });

                    const chat = model.startChat({
                        history: history.filter(h => h.role !== 'proposal').map(h => ({
                            role: h.role === 'model' ? 'model' : 'user',
                            parts: [{ text: h.text }]
                        }))
                    });

                    const result = await chat.sendMessage(input);
                    const text = result.response.text();
                    
                    // Extrair JSON se houver
                    const jsonMatch = text.match(/```json\n([\s\S]*?)\n```/);
                    let cleanText = text.replace(/```json\n[\s\S]*?\n```/, "").trim();
                    
                    const responseMsg = { role: 'model', text: cleanText };
                    
                    if (jsonMatch) {
                        const data = JSON.parse(jsonMatch[1]);
                        responseMsg.proposal = { 
                            type: data.days ? 'training' : 'diet', 
                            data 
                        };
                    }
                    
                    setHistory(p => [...p, responseMsg]);
                } catch (e) {
                    setHistory(p => [...p, { role: 'model', text: 'Erro de conexão: ' + e.message }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return React.createElement('div', { className: 'flex flex-col h-full bg-slate-50' },
                React.createElement('div', { className: 'p-2 px-4 flex justify-between items-center bg-white border-b' },
                    React.createElement('button', { onClick: exportApp, className: 'text-[9px] font-black uppercase bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-2' }, 
                      React.createElement(ExternalLink, { className: 'w-3 h-3' }), 'Baixar App'
                    ),
                    React.createElement('button', { onClick: onClearChat, className: 'text-[9px] font-black uppercase bg-slate-100 border px-2 py-1.5 rounded-lg text-slate-400' }, 'Limpar Chat')
                ),
                React.createElement('div', { ref: scrollRef, className: 'flex-1 overflow-y-auto p-4 space-y-4' },
                    history.map((msg, i) => React.createElement('div', { key: i, className: `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}` },
                        React.createElement('div', { className: `max-w-[85%] p-4 rounded-2xl ${msg.role === 'user' ? 'bg-blue-600 text-white rounded-tr-none shadow-lg' : 'bg-white border rounded-tl-none shadow-sm'}` },
                            React.createElement('p', { className: 'text-sm whitespace-pre-wrap', dangerouslySetInnerHTML: { __html: msg.text.replace(/IronMind/gi, '<b translate="no" class="notranslate">IronMind</b>') } }),
                            msg.proposal && React.createElement('div', { className: 'mt-4 p-3 bg-blue-50 border border-blue-100 rounded-xl' },
                                React.createElement('p', { className: 'text-[10px] font-black text-blue-900 uppercase mb-2' }, `Proposta de ${msg.proposal.type === 'training' ? 'Treino' : 'Dieta'}`),
                                React.createElement('button', { 
                                    onClick: () => msg.proposal.type === 'training' ? onAcceptTraining(msg.proposal.data) : onAcceptDiet(msg.proposal.data),
                                    className: 'w-full py-2 bg-blue-600 text-white rounded-lg font-black text-[9px] uppercase shadow-md active:scale-95'
                                }, 'Aceitar Protocolo')
                            )
                        )
                    )),
                    isLoading && React.createElement('div', { className: 'animate-pulse text-[9px] font-black uppercase text-slate-400 p-4' }, 'Treinadora está escrevendo...')
                ),
                React.createElement('div', { className: 'p-4 bg-white border-t space-y-2' },
                    React.createElement('form', { 
                        className: 'flex gap-2',
                        onSubmit: (e) => { e.preventDefault(); handleSend(); }
                    },
                        React.createElement('textarea', {
                            value: input,
                            onChange: e => setInput(e.target.value),
                            placeholder: 'Diga: "Monte um treino de pernas"',
                            className: 'flex-1 p-3 bg-slate-50 border rounded-xl text-sm focus:outline-none focus:border-blue-300 resize-none max-h-24',
                            rows: 2
                        }),
                        React.createElement('button', { className: 'bg-blue-600 text-white p-3 rounded-xl self-end' }, React.createElement(Send, { className: 'w-5 h-5' }))
                    )
                )
            );
        }

        function TrainingTab({ plan, onUpdatePlan, onRequestNew, onClearPlan, buildManualTraining }) {
            const [activeDayIdx, setActiveDayIdx] = useState(0);
            const [isLibOpen, setIsLibOpen] = useState(false);
            const [isAddingExercise, setIsAddingExercise] = useState(false);
            const [timer, setTimer] = useState(null);

            if (!plan) return React.createElement(EmptyState, { type: 'treino', onClick: onRequestNew, onManualBuild: buildManualTraining });

            const activeDay = plan.days[activeDayIdx] || plan.days[0];

            return React.createElement('div', { className: 'p-4 space-y-6' },
                React.createElement('div', { className: 'flex justify-between items-center bg-white p-4 rounded-3xl border border-slate-200 shadow-sm' },
                    React.createElement('div', null,
                        React.createElement('p', { className: 'text-[9px] font-black text-slate-400 uppercase' }, 'Plano Ativo'),
                        React.createElement('h3', { className: 'text-xl font-black italic uppercase leading-none' }, plan.name)
                    ),
                    React.createElement('button', { onClick: onClearPlan, className: 'text-rose-500' }, React.createElement(Trash2, { className: 'w-4 h-4' }))
                ),

                React.createElement('div', { className: 'flex gap-2 overflow-x-auto no-scrollbar py-2' },
                    plan.days.map((day, i) => React.createElement('button', {
                        key: i,
                        onClick: () => setActiveDayIdx(i),
                        className: `px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all whitespace-nowrap ${activeDayIdx === i ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-100 text-slate-400'}`
                    }, day.label))
                ),

                React.createElement('div', { className: 'flex justify-between items-end' },
                    React.createElement('div', null,
                        React.createElement('h4', { className: 'text-blue-600 font-black uppercase tracking-tighter italic' }, activeDay.label),

                            className: 'w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase shadow-xl' 
                        }, 'Salvar Exercício'),
                        React.createElement('button', { onClick: onClose, className: 'w-full text-slate-400 py-2 text-[10px] font-bold uppercase' }, 'Cancelar')
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
