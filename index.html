<!doctype html>
<html lang="pt-BR" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>IronMind - Treinador Inteligente</title>
    
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IronMind" />

    <style>
      html, body {
        height: -webkit-fill-available;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then((registration) => {
            // Verifica se há uma versão nova assim que a página abre...
            registration.update();
            // ...e periodicamente enquanto o app fica aberto (ex: durante um treino longo).
            setInterval(() => registration.update(), 5 * 60 * 1000);
          }).catch(err => {
            console.error('Falha ao registrar Service Worker: ', err);
          });

          // Quando um novo Service Worker assume o controle (skipWaiting + clients.claim
          // no sw.js), recarrega a página automaticamente pra buscar o bundle novo.
          // O guard 'refreshing' evita loop de reload, e a checagem de 'controller'
          // evita recarregar no primeiro carregamento (quando ainda não havia controller).
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
